<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5c0b0b">
  <meta name="description" content="Degust Salgados — salgados fritos na hora. Faça seu pedido pelo WhatsApp ou Mais Delivery.">
  <title>Degust Salgados</title>
  <style>
    :root {
      --red: #5c0b0b;
      --red-dark: #430606;
      --orange: #d77f26;
      --cream: #fffaf7;
      --white: #ffffff;
      --shadow: 0 12px 30px rgba(0,0,0,.30);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--red);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--red);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--white);
      overflow-x: hidden;
    }

    .landing {
      position: relative;
      width: min(1080px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding-top: clamp(155px, 39.8vw, 430px);
      padding-bottom: 42px;
      background-color: var(--red);
      background-image: url("background.png");
      background-repeat: no-repeat;
      background-position: center top;
      background-size: 100% auto;
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* CARROSSEL */
    .carousel-wrap {
      width: min(92%, 760px);
      position: relative;
    }

    .carousel {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      padding: 4px;
      cursor: grab;
      user-select: none;
    }

    .carousel:active { cursor: grabbing; }
    .carousel::-webkit-scrollbar { display: none; }

    .slide {
      flex: 0 0 100%;
      scroll-snap-align: center;
      aspect-ratio: 4 / 3;
      border: 6px solid var(--white);
      border-radius: 18px;
      overflow: hidden;
      background: #210303;
      box-shadow: var(--shadow);
    }

    .slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    .dot {
      width: 9px;
      height: 9px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.45);
      cursor: pointer;
      transition: transform .2s ease, background .2s ease;
    }

    .dot.active {
      background: #fff;
      transform: scale(1.25);
    }

    /* BOTÕES */
    .buttons {
      width: min(92%, 760px);
      display: grid;
      gap: 13px;
      margin-top: 20px;
    }

    .order-btn {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 20px;
      border: 3px solid #fff;
      border-radius: 16px;
      background: rgba(92, 11, 11, .94);
      color: #fff;
      text-decoration: none;
      font-size: clamp(16px, 2.2vw, 21px);
      font-weight: 800;
      letter-spacing: .4px;
      box-shadow: 0 8px 20px rgba(0,0,0,.25);
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .order-btn:hover {
      transform: translateY(-2px);
      background: #7b1111;
      box-shadow: 0 12px 26px rgba(0,0,0,.32);
    }

    .order-btn:active { transform: translateY(0); }

    .order-btn svg {
      width: 27px;
      height: 27px;
      flex: 0 0 27px;
      fill: currentColor;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      opacity: .72;
    }

    @media (max-width: 600px) {
      .landing {
        padding-bottom: 28px;
      }

      .slide {
        border-width: 5px;
        border-radius: 14px;
      }

      .buttons {
        margin-top: 16px;
        gap: 10px;
      }

      .order-btn {
        min-height: 58px;
        border-width: 2px;
        border-radius: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .carousel { scroll-behavior: auto; }
      .order-btn { transition: none; }
    }
  </style>
</head>
<body>

  <script>
    const carousel = document.getElementById('carousel');
    const slides = [...carousel.querySelectorAll('.slide')];
    const dots = [...document.querySelectorAll('.dot')];
    let index = 0;
    let timer;
    let isPointerDown = false;
    let startX = 0;
    let startScroll = 0;

    function goTo(i, smooth = true) {
      index = (i + slides.length) % slides.length;
      carousel.scrollTo({
        left: slides[index].offsetLeft - carousel.offsetLeft,
        behavior: smooth ? 'smooth' : 'auto'
      });
      dots.forEach((dot, n) => dot.classList.toggle('active', n === index));
    }

    function startAuto() {
      clearInterval(timer);
      timer = setInterval(() => goTo(index + 1), 5000);
    }

    dots.forEach((dot, i) => {
      dot.addEventListener('click', () => {
        goTo(i);
        startAuto();
      });
    });

    carousel.addEventListener('pointerdown', (e) => {
      isPointerDown = true;
      startX = e.clientX;
      startScroll = carousel.scrollLeft;
      carousel.setPointerCapture(e.pointerId);
      clearInterval(timer);
    });

    carousel.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      carousel.scrollLeft = startScroll - (e.clientX - startX);
    });

    function endDrag() {
      if (!isPointerDown) return;
      isPointerDown = false;
      const width = carousel.clientWidth;
      const moved = carousel.scrollLeft - startScroll;

      if (Math.abs(moved) > width * 0.15) {
        goTo(index + (moved > 0 ? 1 : -1));
      } else {
        goTo(index);
      }
      startAuto();
    }

    carousel.addEventListener('pointerup', endDrag);
    carousel.addEventListener('pointercancel', endDrag);
    carousel.addEventListener('mouseleave', endDrag);

    carousel.addEventListener('scroll', () => {
      if (isPointerDown) return;
      const center = carousel.scrollLeft + carousel.clientWidth / 2;
      let closest = 0;
      let distance = Infinity;

      slides.forEach((slide, i) => {
        const slideCenter = slide.offsetLeft + slide.offsetWidth / 2;
        const d = Math.abs(center - slideCenter);
        if (d < distance) {
          distance = d;
          closest = i;
        }
      });

      if (closest !== index) {
        index = closest;
        dots.forEach((dot, n) => dot.classList.toggle('active', n === index));
      }
    });

    window.addEventListener('resize', () => goTo(index, false));

    goTo(0, false);
    startAuto();
  </script>
